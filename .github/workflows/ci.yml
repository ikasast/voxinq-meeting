name: CI

on:
  push:
    branches: [main]
  pull_request:

# The web app's checks are four jobs rather than one. Lint, types, the build and the tests do not
# depend on one another, and run in a row they were most of the wait: about 110 s, of which the
# tests themselves were 9. Nothing is checked less than before; the same commands run, side by
# side. The repository is public, so the extra runners cost nothing.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      # ESLint's own cache, keyed on content rather than timestamps: a checkout gives every file
      # a new mtime, which would make the default strategy miss on everything. A changed file,
      # rule or plugin is linted again; an unchanged one is not.
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-
      - run: npm run lint -- --cache --cache-strategy content --cache-location .eslintcache

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      # The route types (RouteContext, the route validator) used to come from running the whole
      # build first. `next typegen` writes the same files in a couple of seconds, so the types
      # no longer wait for the build.
      - run: npx next typegen
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STT_WS_URL: ws://localhost:8000/ws
      # Not connected during a build; the value only has to parse.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://voxinq:voxinq@localhost:5432/voxinq
      # The queue's tests write to the database and claim whatever is queued, so they only run
      # where the database is disposable. Here it is a container that dies with the job.
      VOXINQ_QUEUE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      # Started by hand rather than as a service container. A service is pulled and health-checked
      # before the first step, which put 18 s in front of everything; started in the background
      # here, it comes up while the dependencies are restored.
      #
      # The image production runs, and with durability off: fsync and the rest protect data from
      # a power cut, and this database is thrown away when the job ends.
      - name: Start PostgreSQL
        run: |
          nohup docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=voxinq -e POSTGRES_PASSWORD=voxinq -e POSTGRES_DB=voxinq \
            postgres:17-alpine -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            > "$RUNNER_TEMP/postgres-start.log" 2>&1 &
      - uses: ./.github/actions/node-setup
      # Over TCP on purpose: while the image initialises, it runs a temporary server on the socket
      # only, and a socket check would pass just before that server is stopped and restarted.
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 90); do
            docker exec pg pg_isready -h 127.0.0.1 -U voxinq >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres-start.log"
          docker logs pg || true
          exit 1
      # Also validates that the migration history builds a working schema.
      - run: npx prisma migrate deploy
      - run: npm test

  # The name the branch ruleset requires, kept so that splitting the job did not mean changing
  # the repository's settings. It passes only when all four did.
  #
  # `if: always()` is load-bearing. Without it this job is skipped when one of the four fails,
  # and a skipped job reports success to a required check -- a red lint would have been mergeable.
  web:
    if: always()
    needs: [lint, typecheck, build, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, typecheck, build, test: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Syntax-level check only: the heavy CUDA deps are not installable in CI.
      - run: python -m py_compile stt-service/server.py stt-service/backends.py diarization/diarize.py

      # Backend selection decides what a given machine runs, including the promise that a CUDA
      # host still gets faster-whisper. It needs neither models nor a GPU, so it can be checked
      # properly here rather than left to a syntax check.
      #
      # pywhispercpp is installed as well so the decode test runs for real. It is the backend
      # every machine without CUDA depends on, it needs only a CPU and a 75 MB model, and a
      # parameter bug in exactly that path once made every finalized utterance fail while the
      # selection tests stayed green.
      - run: pip install numpy pywhispercpp
      - run: python stt-service/test_backends.py

      # Dividing an utterance between the people who spoke in it: which words fall on which
      # side of a speaker change. Pure arithmetic over written-out turns, so no models and no
      # GPU — and it is the part that would put text on the wrong speaker without saying so.
      - run: python diarization/test_diarize.py

      # Translation without its 1.2GB model: which languages are offered, and the cleanup
      # that drops a copy of the source the model sometimes writes before translating.
      - run: python stt-service/test_translator.py

  # Catches rot in the container setup (bad Dockerfile, a dependency that stopped
  # resolving) without waiting for someone to try `docker compose up`.
  #
  # Only the web image is built. The STT image pulls a CUDA base plus a CUDA build of
  # torch — far past a runner's disk budget, and it could not be exercised anyway with
  # no GPU. It is verified on the GPU host instead.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Mirrors the documented first step, so this also checks that .env.example is a
      # usable starting point rather than only that the YAML parses.
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
      # Deliberately without a layer cache. Measured on this workflow: restoring the cached
      # `npm ci` layer from the Actions cache took 32-40 s against 21 s for running `npm ci`, and
      # writing the cache on main took four minutes. It only won when no source had changed,
      # which is not what a pull request is.
      - name: Build the web image
        run: docker build -t voxinq-web:ci .

  # The licences of everything the app depends on, from its lockfiles: a list to read, and a
  # check that nothing arrives under a licence an MIT project offered commercially cannot carry
  # (scripts/licences.mjs says which). The published images get the same list, with their
  # operating-system packages, at release time (publish-images.yml).
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          upload-artifact: false
      - run: node scripts/licences.mjs THIRD_PARTY_LICENSES.md sbom-source.spdx.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licences
          path: |
            THIRD_PARTY_LICENSES.md
            sbom-source.spdx.json
