# Build the Android app on every change to it, and keep the APK.
#
# Until the app is published, the artifact is how a debug build reaches a phone without Android
# Studio. Release signing comes with distribution (docs/android-app.md).

name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Also checks the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: voxinq-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
