name: Release tarball

# The archive the package managers install from: source, plus the launcher, minus everything
# that only matters to someone working on Voxinq. `.gitattributes` decides what is in it
# (export-ignore), so there is no second list here to drift out of step with the first.
#
# Source rather than a built bundle, deliberately. A prebuilt one would have to carry
# node_modules -- around a gigabyte, platform-specific, and stale the moment a dependency is
# patched. `voxinq setup` builds it on the machine it will run on, which is also how the
# formula and the manifest tell people to finish installing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the archive from (e.g. v2.0.0-beta.3)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.build.outputs.name }}
      sha: ${{ steps.build.outputs.sha }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build the archive
        id: build
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # The version without the leading v, which is what a tarball is conventionally named
          # by and what Scoop's and Homebrew's $version interpolation expects.
          version="${TAG#v}"
          name="voxinq-${version}"
          # --prefix so the archive unpacks into its own directory rather than over the cwd,
          # which is also what `extract_dir` in the Scoop manifest expects.
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          sha256sum "${name}.tar.gz" | cut -d' ' -f1 > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat "${name}.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
          ls -l "${name}.tar.gz"

      - name: Check it holds what it should, and not what it should not
        env:
          NAME: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          files=$(tar -tzf "${NAME}.tar.gz")
          # Present: everything needed to run.
          for want in package.json next.config.ts prisma/schema.prisma cli/src/index.mjs \
                      cli/voxinq.cmd stt-service/server.py diarization/diarize.py app/layout.tsx; do
            echo "$files" | grep -qx "${NAME}/${want}" || { echo "missing: ${want}"; exit 1; }
          done
          # Absent: the parts export-ignore removes. A silent regression here quadruples the
          # download and ships screenshots to every install.
          for unwanted in Dockerfile docker-compose.yml AGENTS.md; do
            if echo "$files" | grep -qx "${NAME}/${unwanted}"; then
              echo "should not be in the archive: ${unwanted}"; exit 1
            fi
          done
          for dir in docs tests .github; do
            if echo "$files" | grep -q "^${NAME}/${dir}/"; then
              echo "should not be in the archive: ${dir}/"; exit 1
            fi
          done
          echo "archive contents look right"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.build.outputs.name }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber

      - name: Report the hash
        env:
          NAME: ${{ steps.build.outputs.name }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          {
            echo "### ${NAME}.tar.gz"
            echo
            echo '```'
            echo "sha256  ${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            ${{ steps.build.outputs.name }}.tar.gz
            ${{ steps.build.outputs.name }}.tar.gz.sha256

  # Publishing the manifests is the step that kept being forgotten: it can only run after the
  # release exists (the manifests carry the tarball's SHA-256), which puts it outside the
  # release commit, and twice in a row that meant `scoop install voxinq` served a prerelease.
  publish-manifests:
    needs: tarball
    # Only for a real release. A prerelease must not become what a package manager installs,
    # for the same reason it does not move the `latest` image tag.
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Point the manifests at this release
        env:
          VERSION: ${{ needs.tarball.outputs.version }}
          SHA: ${{ needs.tarball.outputs.sha }}
        run: node packaging/render.mjs "$VERSION" "$SHA"

      - name: Publish them to the tap and the bucket
        env:
          # A fine-grained PAT with Contents: read and write on ikasast/homebrew-voxinq and
          # ikasast/scoop-voxinq. GITHUB_TOKEN cannot reach another repository.
          TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          VERSION: ${{ needs.tarball.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::PACKAGING_TOKEN is not set — the tap and bucket were left on the previous release."
            exit 1
          fi
          git config --global user.name "voxinq-release"
          git config --global user.email "noreply@github.com"

          publish() {
            repo="$1"; dest="$2"; src="$3"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/ikasast/${repo}.git" "/tmp/${repo}"
            install -D -m 644 "$src" "/tmp/${repo}/${dest}"
            cd "/tmp/${repo}"
            if git diff --quiet; then
              echo "${repo}: already at v${VERSION}"
              return
            fi
            git add -A
            git commit -q -m "Update to v${VERSION}"
            git push -q origin HEAD
            echo "${repo}: published v${VERSION}"
            cd - >/dev/null
          }

          publish scoop-voxinq  bucket/voxinq.json    "$GITHUB_WORKSPACE/packaging/scoop/voxinq.json"
          publish homebrew-voxinq Formula/voxinq.rb   "$GITHUB_WORKSPACE/packaging/homebrew/voxinq.rb"

      # Housekeeping, and deliberately not allowed to fail the release. By this point the
      # manifests are already live in the tap and the bucket, which is the part that matters;
      # bringing this repository's copies into line is tidiness. A red release here would say
      # the distribution failed when it did not, which is worse than an unmerged branch.
      - name: Offer the repository's own copies a branch to catch up on
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tarball.outputs.version }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet; then
            echo "packaging/ already matches what was published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="packaging-v${VERSION}"
          git config user.name "voxinq-release"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          git commit -qam "Point the packaging definitions at v${VERSION}"
          git push -q origin "$branch"

          # Opening the PR needs "Allow GitHub Actions to create and approve pull requests",
          # which is off by default. Without it the branch is still pushed, and the link below
          # is one click from a pull request.
          if gh pr create --base main --head "$branch" \n            --title "Point the packaging definitions at v${VERSION}" \n            --body "Opened by the release workflow, which has already published these to the tap and the bucket. Merging keeps this repository's copies equal to what a package manager installs, so a diff between them stays meaningful."; then
            echo "Opened a PR for packaging/." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### packaging/ needs a one-click PR"
              echo
              echo "The tap and the bucket are already on v${VERSION}. Only this repository's"
              echo "copies are behind, and Actions may not open pull requests here:"
              echo
              echo "<https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
