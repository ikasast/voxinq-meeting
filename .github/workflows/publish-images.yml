name: Publish images

# Publishes the images the compose file pulls, so installing needs only docker-compose.yml
# and .env — no clone, no Node, no Python.
#
# Runs on a published release, and on demand. Not on every push: the STT image is ~21 GB and
# takes half an hour to build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.3.0-rc1). Does not move latest."
        required: true

env:
  REGISTRY: ghcr.io
  # Lowercased owner/repo; GHCR rejects uppercase.
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IMAGE: ${{ env.IMAGE_BASE }}/web
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$TAG"
            # Only a published release moves `latest`. A manual run publishes its own tag
            # alone, so a trial build cannot become the image everyone pulls by default.
            if [ "$GITHUB_EVENT_NAME" = release ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No NEXT_PUBLIC_STT_WS_URL here on purpose: baking one into a published image
          # would fix it for everyone. The container reads STT_WS_URL at runtime instead.

  stt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image is ~21 GB — a stock runner has about 14 GB free, so the build dies part
      # way through without this. Reclaiming the preinstalled toolchains gets it to ~45 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Show available space
        run: df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IMAGE: ${{ env.IMAGE_BASE }}/stt
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$TAG"
            # Same as the web job: `latest` follows releases only.
            if [ "$GITHUB_EVENT_NAME" = release ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stt-service/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # No gha cache: the layers are far past the 10 GB cache limit, so it would evict
          # itself every run and cost time rather than save it.
