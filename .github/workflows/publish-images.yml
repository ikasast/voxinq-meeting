name: Publish images

# Publishes the images the compose file pulls, so installing needs only docker-compose.yml
# and .env — no clone, no Node, no Python.
#
# Runs on a published release, and on demand. Not on every push: the STT image is ~21 GB and
# takes half an hour to build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.3.0-rc1). Does not move latest."
        required: true

env:
  REGISTRY: ghcr.io
  # Lowercased owner/repo; GHCR rejects uppercase.
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IMAGE: ${{ env.IMAGE_BASE }}/web
          # Only a full release moves `latest`. A manual run publishes its own tag alone, and a
          # pre-release must not become what `docker compose up -d` pulls — an alpha of the next
          # major would otherwise land on every install that never asked for it.
          # The event_name test is load-bearing: on workflow_dispatch there is no release object,
          # and GitHub's `==` treats that null as equal to false.
          MOVES_LATEST: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$TAG"
            if [ "$MOVES_LATEST" = true ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No NEXT_PUBLIC_STT_WS_URL here on purpose: baking one into a published image
          # would fix it for everyone. The container reads STT_WS_URL at runtime instead.

  stt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image is ~21 GB — a stock runner has about 14 GB free, so the build dies part
      # way through without this. Reclaiming the preinstalled toolchains gets it to ~45 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Show available space
        run: df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IMAGE: ${{ env.IMAGE_BASE }}/stt
          # Same rule as the web job: full releases only, never a manual run or a pre-release.
          MOVES_LATEST: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$TAG"
            if [ "$MOVES_LATEST" = true ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stt-service/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # No gha cache: the layers are far past the 10 GB cache limit, so it would evict
          # itself every run and cost time rather than save it.
