# Do not start the bundled Ollama: there is already one on this machine.
#
#   docker compose -f docker-compose.yml -f docker-compose.external-ollama.yml up -d
#
# Somebody who already runs Ollama has the models on disk once. Starting the container as well
# downloads them a second time into a volume, to be served by a second copy of the same
# program. This turns that service off and leaves everything else alone.
#
# Then point Settings -> LLM at the host: http://host.docker.internal:11434
#
# Two things have to be true on the host side, and neither is this file's doing:
#   - Ollama must listen beyond loopback, which is not its default. Set OLLAMA_HOST=0.0.0.0
#     for the service; otherwise the container's request arrives at an address nothing answers.
#   - The port must not be firewalled off from Docker's bridge network.
#
# The service is not deleted -- an override cannot do that -- but given a profile nothing
# enables, which is how Compose is asked to skip one.
services:
  ollama:
    profiles: ["disabled"]
