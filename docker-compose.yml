# Voxinq Meeting — full stack in one command.
#
# This file is all you need; the images come from ghcr.io, so there is no clone and no Node or
# Python on the host.
#
#   curl -O https://raw.githubusercontent.com/ikasast/voxinq-meeting/release/docker-compose.yml
#   docker compose up -d
#
# **No `.env` is needed to start.** The passwords and keys the services share are generated on
# the first start by the `init-secrets` service below and kept in volumes. A `.env` beside this
# file is still read, for the settings that are yours to choose (a timezone, the address a phone
# uses, ports), and anything it sets wins over a generated value. The template with every
# setting explained:
#
#   curl -o .env https://raw.githubusercontent.com/ikasast/voxinq-meeting/release/.env.example
#
# **It is a starting point, and it is yours.** Nothing updates it after you download it -- not
# `docker compose pull`, which moves the images -- so edit it to match the machine you are on:
# delete a service you do not want, change a published port, drop the GPU reservations. The
# comments below say what each part is for and what happens without it. `.env` is for the
# settings; this file is for the shape of the thing.
#
# Needs Docker Compose 2.24 or later, for the optional `.env` (Docker Desktop has had it since
# early 2024).
#
# To build from a checkout instead (development, or an unreleased change), add the build
# override: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Requires the NVIDIA Container Toolkit on the host for the `stt` and `ollama` services.
# See docs/setup.md → "Docker".
#
# Note on ports: the browser connects to the STT service **directly** over WebSocket (the web
# app never proxies audio), so port 8000 has to be reachable from the browser — it is not an
# internal-only service. The page works out where it is from its own address (see STT_WS_URL
# under `web`).
#
# Every published port is overridable from .env, because these are ordinary ports that a
# machine may already be using — a local PostgreSQL on 5432 is common enough that the
# documented `docker compose up -d` would otherwise fail on a bind error before anything
# starts. The services always reach each other by name on the compose network, so moving a
# host port changes nothing internally:
#
#   WEB_PORT=3100          # then browse http://localhost:3100
#   STT_PORT=8100          # the page follows it automatically
#   DB_PORT=127.0.0.1:5433
#   OLLAMA_PORT=127.0.0.1:11435

services:
  # Generates the secrets the other services share, once, so that nobody has to invent them.
  #
  # It runs at every `docker compose up` and exits; a value that already exists is never
  # replaced, so it only writes anything on the first start. Each value is 32 random bytes
  # from /dev/urandom, as hex. They live in three volumes, so that each service holds only
  # what it uses: the database never sees the web app's keys, and the transcription service
  # never sees the database password.
  #
  #   postgres_password  the database's password            db, web
  #   stt_secret         what web signs its STT requests with  web, stt
  #   key_secret         wraps the keys open during a session  web
  #   session_secret     signs the sign-in cookie              web
  #
  # A value set in `.env` wins over the generated one (POSTGRES_PASSWORD, VOXINQ_STT_SECRET,
  # VOXINQ_KEY_SECRET, APP_SESSION_SECRET), so an install that already has them is unchanged.
  # The images read these files in docker/with-secrets.sh.
  #
  # Keep `secrets-web` out of anything you back up next to the database, as you would
  # VOXINQ_KEY_SECRET: a backup should not carry the key that opens it. **Do not delete these
  # volumes** on their own: the database keeps the password it was created with, and a new
  # one would lock the web app out of it.
  #
  # The database image, because it is already being pulled and has a shell; nothing of
  # PostgreSQL runs here.
  init-secrets:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        umask 077
        for name in postgres_password stt_secret key_secret session_secret; do
          if [ ! -s "/web/$$name" ]; then
            head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "/web/$$name"
            echo "generated $$name"
          fi
        done
        cp /web/postgres_password /db/postgres_password
        cp /web/stt_secret /stt/stt_secret
    volumes:
      - secrets-db:/db
      - secrets-web:/web
      - secrets-stt:/stt
    restart: "no"

  # Meeting data.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxinq}
      POSTGRES_USER: ${POSTGRES_USER:-voxinq}
      # Empty unless `.env` sets it, and then the generated one is used. It only matters the
      # first time the database starts: PostgreSQL keeps the password it was created with.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    # The image's own entrypoint, after taking the generated password when none was given.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$POSTGRES_PASSWORD" ] || export POSTGRES_PASSWORD="$$(cat /run/voxinq/postgres_password)"; exec docker-entrypoint.sh "$$@"'
      - docker-entrypoint.sh
    command: ["postgres"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets-db:/run/voxinq:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    # Published on loopback so host tools (psql, pg_dump backups) can reach it.
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxinq} -d ${POSTGRES_DB:-voxinq}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Web app. Runs `prisma migrate deploy` on start.
  web:
    image: ghcr.io/ikasast/voxinq-meeting/web:${VOXINQ_VERSION:-latest}
    # Read when it is there; nothing in it is needed to start.
    env_file:
      - path: .env
        required: false
    environment:
      # With no DATABASE_URL in `.env`, the image builds one for the `db` service from these and
      # the generated password.
      POSTGRES_DB: ${POSTGRES_DB:-voxinq}
      POSTGRES_USER: ${POSTGRES_USER:-voxinq}
      # Server-side reach to STT (container-to-container, unlike the browser's URL below).
      STT_INTERNAL_URL: http://stt:8000
      # Where the BROWSER should reach STT. Usually left unset: the page then derives it from
      # its own address -- https://<host>/ finds wss://<host>:8443/ws, the layout tailscale
      # serve and the `tailscale` service below both use, and http://localhost:3000/ finds
      # ws://localhost:<STT_PORT>/ws. Set STT_WS_URL in .env only for a different layout; it is
      # read at request time, so no rebuild.
      STT_WS_URL: ${STT_WS_URL:-}
      STT_PORT: ${STT_PORT:-8000}
      # Seeds the default shown in Settings → LLM. Loopback is right for a native install but
      # means "this container" here, so name the service instead — otherwise a fresh install
      # cannot generate minutes until someone edits the setting by hand.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Kept on a volume rather than bind-mounted: Docker turns a bind mount of a not-yet-
      # existing file into a directory, which breaks saving from the Settings UI.
      VOXINQ_SETTINGS_PATH: /data/settings.json
      # Whether this server makes new accounts. `open` (the default) turns a tailnet identity
      # nobody has seen into an account the first time it appears, which is what lets a
      # household's phones work without anybody administering anything. `closed` means an
      # administrator makes them, and an identity with no account is sent to the login page.
      # Set here rather than in the app on purpose: somebody who can change settings should not
      # be able to reopen the door. The first account is exempt either way.
      VOXINQ_SIGNUP: ${VOXINQ_SIGNUP:-open}
      # Wraps the keys that are open while somebody is using the app or has work queued. Without
      # it a stolen database alone reads whatever was unlocked; with it, a dump or a backup on
      # its own does not. Keep it out of the backup. Generated unless `.env` sets it.
      VOXINQ_KEY_SECRET: ${VOXINQ_KEY_SECRET:-}
      # Shared with `stt` below: the web app signs what it asks of the transcription service and
      # issues each recording a token for its own meeting, and the service refuses anything
      # else. Both services must get the same value. Generated unless `.env` sets
      # VOXINQ_STT_SECRET -- or POSTGRES_PASSWORD, which installs from before the generated
      # secrets used, and which this still falls back to so that they keep working unchanged.
      STT_SECRET: ${VOXINQ_STT_SECRET:-${POSTGRES_PASSWORD:-}}
      # Meeting dates on the list, the detail header, the print page and the exports are
      # formatted here, in the container. A container has no timezone unless it is given
      # one, so leaving this unset renders them in UTC while the browser renders the
      # transcript timestamps in local time — the same meeting then shows two clocks.
      TZ: ${TZ:-UTC}
      # Recognition somewhere else, for a machine with no NVIDIA and no Apple silicon, where
      # doing it here takes about three times the length of the meeting. These only seed the
      # settings screen's defaults -- Settings -> Transcription is where it is chosen, and what
      # is set there wins. They belong to `web` and not to `stt` because the app holds the
      # settings and posts the job; the key never passes through a browser.
      #
      #   STT_PROVIDER_DEFAULT is implied: setting STT_BACKEND here selects "remote" on first run.
      #
      # Any /v1/audio/transcriptions endpoint works -- Groq, OpenAI, Fireworks, OpenRouter, or a
      # whisper server of your own on another machine. There is no live transcript either way:
      # this applies to the after-the-meeting pass, which is what a host without acceleration
      # already does.
      STT_BACKEND: ${STT_BACKEND:-}
      STT_CLOUD_BASE_URL: ${STT_CLOUD_BASE_URL:-}
      STT_CLOUD_API_KEY: ${STT_CLOUD_API_KEY:-}
      STT_CLOUD_MODEL: ${STT_CLOUD_MODEL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # So that Settings -> LLM can be pointed at an Ollama already running on the host, rather
    # than the container below. Docker Desktop resolves this name on its own; Linux does not,
    # and without this line the same setting that works on a Mac fails there with nothing to
    # say why.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - settings:/data
      - secrets-web:/run/voxinq:ro
    # No `depends_on: db` requirement beyond ordering: an external-viewer deployment points
    # DATABASE_URL at another host and runs `docker compose up -d web` alone.
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Transcription + diarization.
  #
  # No NVIDIA GPU? Two changes, and docker-compose.cpu.yml makes both for you (see the bottom
  # of this file). By hand: put `-cpu` on the end of the image tag below, and delete the
  # `deploy:` block -- Compose refuses to start a service reserving a device the host does not
  # have, and env substitution can change a value but not remove a key.
  stt:
    image: ghcr.io/ikasast/voxinq-meeting/stt:${VOXINQ_VERSION:-latest}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Unset means "choose from the hardware": pyannote on CUDA, sherpa-onnx without it.
      DIA_BACKEND: ${DIA_BACKEND:-}
      # When a line is divided between two speakers, fold pieces shorter than this many seconds
      # into a neighbour. Unset keeps every piece: a short one is usually a real "yes".
      DIA_MIN_PIECE_S: ${DIA_MIN_PIECE_S:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      # The browser's origin must be allowed; it opens a recording's connection here directly.
      STT_ALLOWED_ORIGINS: ${STT_ALLOWED_ORIGINS:-}
      # The same as web's: only the web app's signed requests, and recordings carrying its token
      # for their meeting, are answered. Without it anybody who reaches the port can use it.
      # Generated unless `.env` sets it, as for web.
      STT_SECRET: ${VOXINQ_STT_SECRET:-${POSTGRES_PASSWORD:-}}
      # Log timestamps only — nothing here is shown in the UI — but a stack whose services
      # disagree about what time it is makes correlating logs needlessly hard.
      TZ: ${TZ:-UTC}
    ports:
      - "${STT_PORT:-8000}:8000"
    volumes:
      - recordings:/data/recordings
      # Several GB of Whisper / pyannote weights — without this they re-download on every
      # container rebuild.
      - hfcache:/data/huggingface
      - secrets-stt:/run/voxinq:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Local LLM for minutes. Point Settings → LLM at http://ollama:11434.
  #
  # Already running Ollama on this machine? Then this is a second copy of the same program
  # downloading the same models again. Two ways to not have it, and they are equivalent:
  # delete this service outright — this file is yours once you have downloaded it, and nothing
  # replaces it — or set OLLAMA_PROFILE in .env to anything at all, which moves it into a
  # profile nothing enables. Unset resolves to an empty profile, which Compose reads as "no
  # profile" and starts as always, so neither is imposed on anyone who wants the container.
  # The second entry keeps it starting when `COMPOSE_PROFILES=tailscale` turns on the
  # `tailscale` service below: once any profile is active, the empty one no longer counts.
  #
  # Either way, point Settings → LLM at http://host.docker.internal:11434 and give the host's
  # Ollama OLLAMA_HOST=0.0.0.0 — its default is loopback, which from in here is in here.
  ollama:
    # A fixed release rather than `latest`, so a `docker compose pull` for a Voxinq update does not
    # also change the model server underneath it. Dependabot proposes newer ones.
    image: ollama/ollama:0.40.13
    profiles: ["${OLLAMA_PROFILE:-}", "${OLLAMA_PROFILE:-tailscale}"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-127.0.0.1:11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Optional: Tailscale in a container of its own, so that the PC needs no Tailscale installed
  # and no `tailscale serve` commands. It joins your tailnet as a machine of its own, named
  # TS_HOSTNAME, and serves the app on https://<TS_HOSTNAME>.<tailnet>.ts.net/ and the
  # transcription service on :8443 of the same name -- the layout the page derives the
  # transcription service's address from, so nothing else needs setting.
  #
  # Off unless enabled. Turn it on with two lines in .env:
  #
  #   COMPOSE_PROFILES=tailscale
  #   TS_AUTHKEY=tskey-auth-...     # https://login.tailscale.com/admin/settings/keys
  #
  # The key is used once, to join; after that the login lives in the `tailscale` volume and the
  # key can expire. MagicDNS and HTTPS Certificates must be on in the tailnet's DNS settings, as
  # for `tailscale serve`. Requests arrive with the Tailscale-User-Login header, as they do
  # through `tailscale serve`, so accounts and the external-request rules work the same way.
  #
  # Nothing here is published on the PC: the app is reached through the tailnet name alone.
  # Do not run it and `tailscale serve` for the same app at once -- that is two addresses for
  # one server.
  tailscale:
    image: tailscale/tailscale:v1.104.4
    profiles: ["tailscale"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-voxinq}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking (the image's default): no /dev/net/tun and no extra privileges.
      # The container reaches `web` and `stt` by name on the compose network.
      TS_USERSPACE: "true"
    configs:
      - source: tailscale-serve
        target: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
    restart: unless-stopped

configs:
  # What the `tailscale` service serves. $${TS_CERT_DOMAIN} becomes the machine's own
  # <name>.<tailnet>.ts.net when the container starts.
  tailscale-serve:
    content: |
      {
        "TCP": {
          "443": { "HTTPS": true },
          "8443": { "HTTPS": true }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://web:3000" } } },
          "$${TS_CERT_DOMAIN}:8443": { "Handlers": { "/": { "Proxy": "http://stt:8000" } } }
        }
      }

volumes:
  pgdata:
  settings:
  recordings:
  hfcache:
  ollama:
  # The `tailscale` service's login. Removing it makes the machine join again, under a new name.
  tailscale:
  # Written by init-secrets; see there before removing any of them.
  secrets-db:
  secrets-web:
  secrets-stt:

# Two files sit beside this one for the situations that need a key removed rather than a value
# changed, which is the one thing .env cannot do:
#
#   docker-compose.cpu.yml    no NVIDIA GPU: CPU images, GPU reservations off
#   docker-compose.build.yml  build from a checkout instead of pulling published images
#
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# Or make the same edits here directly. They are the same two changes either way.
