# Voxinq Meeting — full stack in one command.
#
# This file and .env are all you need; the images come from ghcr.io, so there is no clone and
# no Node or Python on the host.
#
# **It is a starting point, and it is yours.** Nothing updates it after you download it -- not
# `docker compose pull`, which moves the images -- so edit it to match the machine you are on:
# delete a service you do not want, change a published port, drop the GPU reservations. The
# comments below say what each part is for and what happens without it. `.env` is for the
# settings; this file is for the shape of the thing.
#
#   curl -O https://raw.githubusercontent.com/ikasast/voxinq-meeting/release/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/ikasast/voxinq-meeting/release/.env.example
#   # edit .env, then
#   docker compose up -d
#
# To build from a checkout instead (development, or an unreleased change), add the build
# override: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Requires the NVIDIA Container Toolkit on the host for the `stt` and `ollama` services.
# See docs/setup.md → "Docker".
#
# Note on ports: the browser connects to the STT service **directly** over WebSocket (the web
# app never proxies audio), so port 8000 has to be reachable from the browser — it is not an
# internal-only service. STT_WS_URL below tells the browser where that is, and unlike the
# build-time NEXT_PUBLIC_ value it takes effect on a restart.
#
# Every published port is overridable from .env, because these are ordinary ports that a
# machine may already be using — a local PostgreSQL on 5432 is common enough that the
# documented `docker compose up -d` would otherwise fail on a bind error before anything
# starts. The services always reach each other by name on the compose network, so moving a
# host port changes nothing internally:
#
#   WEB_PORT=3100          # then browse http://localhost:3100
#   STT_PORT=8100          # STT_WS_URL follows it automatically unless you set one
#   DB_PORT=127.0.0.1:5433
#   OLLAMA_PORT=127.0.0.1:11435

services:
  # Meeting data.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxinq}
      POSTGRES_USER: ${POSTGRES_USER:-voxinq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on loopback so host tools (psql, pg_dump backups) can reach it.
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxinq} -d ${POSTGRES_DB:-voxinq}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Web app. Runs `prisma migrate deploy` on start.
  web:
    image: ghcr.io/ikasast/voxinq-meeting/web:${VOXINQ_VERSION:-latest}
    env_file: .env
    environment:
      # Server-side reach to STT (container-to-container, unlike the browser's URL below).
      STT_INTERNAL_URL: http://stt:8000
      # Where the BROWSER should reach STT. Read at request time, so the published image does
      # not need rebuilding to change it — set STT_WS_URL in .env and restart web.
      STT_WS_URL: ${STT_WS_URL:-ws://localhost:${STT_PORT:-8000}/ws}
      # Seeds the default shown in Settings → LLM. Loopback is right for a native install but
      # means "this container" here, so name the service instead — otherwise a fresh install
      # cannot generate minutes until someone edits the setting by hand.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Kept on a volume rather than bind-mounted: Docker turns a bind mount of a not-yet-
      # existing file into a directory, which breaks saving from the Settings UI.
      VOXINQ_SETTINGS_PATH: /data/settings.json
      # Meeting dates on the list, the detail header, the print page and the exports are
      # formatted here, in the container. A container has no timezone unless it is given
      # one, so leaving this unset renders them in UTC while the browser renders the
      # transcript timestamps in local time — the same meeting then shows two clocks.
      TZ: ${TZ:-UTC}
      # Recognition somewhere else, for a machine with no NVIDIA and no Apple silicon, where
      # doing it here takes about three times the length of the meeting. These only seed the
      # settings screen's defaults -- Settings -> Transcription is where it is chosen, and what
      # is set there wins. They belong to `web` and not to `stt` because the app holds the
      # settings and posts the job; the key never passes through a browser.
      #
      #   STT_PROVIDER_DEFAULT is implied: setting STT_BACKEND here selects "remote" on first run.
      #
      # Any /v1/audio/transcriptions endpoint works -- Groq, OpenAI, Fireworks, OpenRouter, or a
      # whisper server of your own on another machine. There is no live transcript either way:
      # this applies to the after-the-meeting pass, which is what a host without acceleration
      # already does.
      STT_BACKEND: ${STT_BACKEND:-}
      STT_CLOUD_BASE_URL: ${STT_CLOUD_BASE_URL:-}
      STT_CLOUD_API_KEY: ${STT_CLOUD_API_KEY:-}
      STT_CLOUD_MODEL: ${STT_CLOUD_MODEL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # So that Settings -> LLM can be pointed at an Ollama already running on the host, rather
    # than the container below. Docker Desktop resolves this name on its own; Linux does not,
    # and without this line the same setting that works on a Mac fails there with nothing to
    # say why.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - settings:/data
    # No `depends_on: db` requirement beyond ordering: an external-viewer deployment points
    # DATABASE_URL at another host and runs `docker compose up -d web` alone.
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Transcription + diarization.
  #
  # No NVIDIA GPU? Two changes, and docker-compose.cpu.yml makes both for you (see the bottom
  # of this file). By hand: put `-cpu` on the end of the image tag below, and delete the
  # `deploy:` block -- Compose refuses to start a service reserving a device the host does not
  # have, and env substitution can change a value but not remove a key.
  stt:
    image: ghcr.io/ikasast/voxinq-meeting/stt:${VOXINQ_VERSION:-latest}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Unset means "choose from the hardware": pyannote on CUDA, sherpa-onnx without it.
      DIA_BACKEND: ${DIA_BACKEND:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      # The browser's origin must be allowed; it calls this service directly.
      STT_ALLOWED_ORIGINS: ${STT_ALLOWED_ORIGINS:-}
      # Log timestamps only — nothing here is shown in the UI — but a stack whose services
      # disagree about what time it is makes correlating logs needlessly hard.
      TZ: ${TZ:-UTC}
    ports:
      - "${STT_PORT:-8000}:8000"
    volumes:
      - recordings:/data/recordings
      # Several GB of Whisper / pyannote weights — without this they re-download on every
      # container rebuild.
      - hfcache:/data/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Local LLM for minutes. Point Settings → LLM at http://ollama:11434.
  #
  # Already running Ollama on this machine? Then this is a second copy of the same program
  # downloading the same models again. Two ways to not have it, and they are equivalent:
  # delete this service outright — this file is yours once you have downloaded it, and nothing
  # replaces it — or set OLLAMA_PROFILE in .env to anything at all, which moves it into a
  # profile nothing enables. Unset resolves to an empty profile, which Compose reads as "no
  # profile" and starts as always, so neither is imposed on anyone who wants the container.
  #
  # Either way, point Settings → LLM at http://host.docker.internal:11434 and give the host's
  # Ollama OLLAMA_HOST=0.0.0.0 — its default is loopback, which from in here is in here.
  ollama:
    image: ollama/ollama:latest
    profiles: ["${OLLAMA_PROFILE:-}"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-127.0.0.1:11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  settings:
  recordings:
  hfcache:
  ollama:

# Two files sit beside this one for the situations that need a key removed rather than a value
# changed, which is the one thing .env cannot do:
#
#   docker-compose.cpu.yml    no NVIDIA GPU: CPU images, GPU reservations off
#   docker-compose.build.yml  build from a checkout instead of pulling published images
#
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# Or make the same edits here directly. They are the same two changes either way.
