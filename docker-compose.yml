# Voxinq Meeting — full stack in one command.
#
# This file and .env are all you need; the images come from ghcr.io, so there is no clone and
# no Node or Python on the host:
#
#   curl -O https://raw.githubusercontent.com/ikasast/voxinq-meeting/release/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/ikasast/voxinq-meeting/release/.env.example
#   # edit .env, then
#   docker compose up -d
#
# To build from a checkout instead (development, or an unreleased change), add the build
# override: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Requires the NVIDIA Container Toolkit on the host for the `stt` and `ollama` services.
# See docs/setup.md → "Docker".
#
# Note on ports: the browser connects to the STT service **directly** over WebSocket (the web
# app never proxies audio), so port 8000 has to be reachable from the browser — it is not an
# internal-only service. STT_WS_URL below tells the browser where that is, and unlike the
# build-time NEXT_PUBLIC_ value it takes effect on a restart.
#
# Every published port is overridable from .env, because these are ordinary ports that a
# machine may already be using — a local PostgreSQL on 5432 is common enough that the
# documented `docker compose up -d` would otherwise fail on a bind error before anything
# starts. The services always reach each other by name on the compose network, so moving a
# host port changes nothing internally:
#
#   WEB_PORT=3100          # then browse http://localhost:3100
#   STT_PORT=8100          # STT_WS_URL follows it automatically unless you set one
#   DB_PORT=127.0.0.1:5433
#   OLLAMA_PORT=127.0.0.1:11435

services:
  # Meeting data.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxinq}
      POSTGRES_USER: ${POSTGRES_USER:-voxinq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on loopback so host tools (psql, pg_dump backups) can reach it.
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxinq} -d ${POSTGRES_DB:-voxinq}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Web app. Runs `prisma migrate deploy` on start.
  web:
    image: ghcr.io/ikasast/voxinq-meeting/web:${VOXINQ_VERSION:-latest}
    env_file: .env
    environment:
      # Server-side reach to STT (container-to-container, unlike the browser's URL below).
      STT_INTERNAL_URL: http://stt:8000
      # Where the BROWSER should reach STT. Read at request time, so the published image does
      # not need rebuilding to change it — set STT_WS_URL in .env and restart web.
      STT_WS_URL: ${STT_WS_URL:-ws://localhost:${STT_PORT:-8000}/ws}
      # Seeds the default shown in Settings → LLM. Loopback is right for a native install but
      # means "this container" here, so name the service instead — otherwise a fresh install
      # cannot generate minutes until someone edits the setting by hand.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Kept on a volume rather than bind-mounted: Docker turns a bind mount of a not-yet-
      # existing file into a directory, which breaks saving from the Settings UI.
      VOXINQ_SETTINGS_PATH: /data/settings.json
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - settings:/data
    # No `depends_on: db` requirement beyond ordering: an external-viewer deployment points
    # DATABASE_URL at another host and runs `docker compose up -d web` alone.
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Transcription + diarization (GPU).
  stt:
    image: ghcr.io/ikasast/voxinq-meeting/stt:${VOXINQ_VERSION:-latest}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      # The browser's origin must be allowed; it calls this service directly.
      STT_ALLOWED_ORIGINS: ${STT_ALLOWED_ORIGINS:-}
    ports:
      - "${STT_PORT:-8000}:8000"
    volumes:
      - recordings:/data/recordings
      # Several GB of Whisper / pyannote weights — without this they re-download on every
      # container rebuild.
      - hfcache:/data/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Local LLM for minutes. Point Settings → LLM at http://ollama:11434.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-127.0.0.1:11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  settings:
  recordings:
  hfcache:
  ollama:
